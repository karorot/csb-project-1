{% extends "deardiary/layout.html" %}

{% block title %}On this day...{% endblock %}

{% block content %}

<h2>On this day, I...</h2>

<h3>Title: {{ entry.title }}, {{ entry.pub_date }}</h3>

<p>{{ entry.body|safe }}</p>

{% if not entry.public %}
  <p>(This entry is for my eyes only)</p>
{% endif %}

<p><a href="{% url 'home' %}">Return</a></p>

{% endblock %}
